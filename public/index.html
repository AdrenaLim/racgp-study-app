<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RACGP Fellowship Study System</title>
<style>
:root{
  --bg:#050510;--bg2:#0a0a1a;
  --glass:rgba(255,255,255,.04);--glass2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.1);--border-glow:rgba(255,255,255,.15);
  --text:#e2e8f0;--muted:#94a3b8;--dim:#64748b;
  --cyan:#22d3ee;--purple:#a78bfa;--green:#34d399;--red:#f87171;--amber:#fbbf24;
  --accent:var(--cyan);--accent2:var(--purple);
  --font:'Inter','SF Pro Display',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 80% 60% at 50% 0%,rgba(34,211,238,.06),transparent),
  radial-gradient(ellipse 60% 50% at 80% 100%,rgba(167,139,250,.05),transparent);
  pointer-events:none;z-index:0}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}

/* HEADER */
header{position:sticky;top:0;z-index:100;
  background:rgba(5,5,16,.85);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header h1{font-size:1.15rem;font-weight:700;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
header .sub{color:var(--dim);font-size:.75rem}

/* NAV */
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:var(--glass);border:1px solid var(--border);color:var(--muted);
  padding:7px 14px;border-radius:10px;cursor:pointer;font-size:.85rem;font-weight:500;
  transition:all .2s;backdrop-filter:blur(8px)}
nav button:hover{color:var(--text);border-color:var(--border-glow);background:var(--glass2)}
nav button.active{background:rgba(34,211,238,.1);color:var(--cyan);border-color:rgba(34,211,238,.3);
  box-shadow:0 0 20px rgba(34,211,238,.1)}

/* MAIN */
main{max-width:1100px;margin:0 auto;padding:24px 20px 100px;position:relative;z-index:1}
h2{font-size:1.4rem;font-weight:700;margin:0 0 4px}
.lead{color:var(--dim);font-size:.85rem;margin:0 0 20px}

/* GLASS CARD */
.glass{background:var(--glass);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:16px;padding:20px;
  transition:all .25s;position:relative;overflow:hidden}
.glass::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent)}
.glass:hover{border-color:var(--border-glow);background:var(--glass2)}
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

/* STATS */
.stat{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--border);
  border-radius:16px;padding:18px;transition:all .25s}
.stat:hover{border-color:rgba(34,211,238,.3);box-shadow:0 0 30px rgba(34,211,238,.06)}
.stat .num{font-size:1.8rem;font-weight:800;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat .lbl{color:var(--dim);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* TABLES */
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{color:var(--dim);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);
  font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.02)}

/* PILLS */
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill.VH{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.2)}
.pill.H{background:rgba(251,191,36,.12);color:var(--amber);border:1px solid rgba(251,191,36,.2)}
.pill.M{background:rgba(148,163,184,.12);color:var(--muted);border:1px solid rgba(148,163,184,.2)}
.pill.L{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.2)}
.pill.tier1{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.2)}
.pill.tier2{background:rgba(251,191,36,.1);color:var(--amber);border:1px solid rgba(251,191,36,.2)}
.pill.tier3{background:rgba(148,163,184,.1);color:var(--dim);border:1px solid rgba(148,163,184,.2)}
.pill.st-not\ started{background:rgba(148,163,184,.1);color:var(--dim);border:1px solid rgba(148,163,184,.15)}
.pill.st-learning{background:rgba(167,139,250,.12);color:var(--purple);border:1px solid rgba(167,139,250,.2)}
.pill.st-solid{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.2)}
.pill.st-exam\ ready{background:rgba(34,211,238,.12);color:var(--cyan);border:1px solid rgba(34,211,238,.2)}

/* BUTTONS */
button.btn{background:linear-gradient(135deg,var(--cyan),#0891b2);color:#000;border:none;
  border-radius:10px;padding:9px 18px;font-size:.85rem;font-weight:600;cursor:pointer;
  transition:all .2s;box-shadow:0 0 20px rgba(34,211,238,.15)}
button.btn:hover{filter:brightness(1.15);box-shadow:0 0 30px rgba(34,211,238,.25)}
button.btn.green{background:linear-gradient(135deg,var(--green),#059669);box-shadow:0 0 20px rgba(52,211,153,.15)}
button.btn.green:hover{box-shadow:0 0 30px rgba(52,211,153,.25)}
button.btn.subtle{background:var(--glass);color:var(--muted);border:1px solid var(--border)}
button.btn.subtle:hover{color:var(--text);border-color:var(--border-glow)}
button.btn.tiny{padding:4px 10px;font-size:.75rem;border-radius:6px}

/* FORMS */
input[type=text],input[type=date],textarea,select{
  background:var(--glass);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:9px 12px;font-size:.85rem;font-family:var(--font);
  transition:all .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--cyan);
  box-shadow:0 0 20px rgba(34,211,238,.1)}
textarea{width:100%;min-height:64px;resize:vertical}

/* Q OPTIONS */
.q-options label{display:flex;gap:10px;align-items:flex-start;background:var(--glass);
  border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:7px;
  cursor:pointer;font-size:.9rem;transition:all .2s}
.q-options label:hover{border-color:rgba(34,211,238,.3);background:var(--glass2)}
.q-options label.sel{border-color:var(--cyan);background:rgba(34,211,238,.06)}
.q-options label.correct{border-color:var(--green)!important;background:rgba(52,211,153,.08)!important}
.q-options label.wrong{border-color:var(--red)!important;background:rgba(248,113,113,.06)!important}

/* FEEDBACK */
.feedback{border-radius:12px;padding:14px 16px;margin-top:12px;font-size:.85rem}
.feedback.ok{background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.2)}
.feedback.no{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.2)}

/* METAS */
.meta-chip{background:var(--glass);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;margin-bottom:10px}
.meta-chip .k{font-size:.7rem;color:var(--cyan);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.meta-chip .v{font-size:.85rem;margin-top:4px;line-height:1.6}
.meta-chip a{color:var(--cyan);font-size:.8rem;text-decoration:none}

/* EXPAND / DETAILS */
.expand{cursor:pointer;color:var(--cyan);font-size:.8rem;font-weight:600;user-select:none}
details summary{cursor:pointer;color:var(--cyan);font-weight:600;font-size:.9rem}
details.unit{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;
  background:var(--glass);backdrop-filter:blur(12px);overflow:hidden}
details.unit summary{padding:12px 16px;cursor:pointer;font-size:.95rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.unit summary .pill{flex:none}
.sec{margin:10px 0;padding:12px 14px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px}
.sec-h{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--purple);margin-bottom:6px}
.sec p,.li{font-size:.85rem;margin:4px 0;line-height:1.6}
.li.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.case{font-size:.85rem;line-height:1.6;background:rgba(34,211,238,.04);border-left:3px solid var(--cyan);
  padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0}
.unit-body{padding:6px 16px 16px;border-top:1px solid var(--border)}
.gl-link{color:var(--cyan);font-size:.8rem;text-decoration:none;border-bottom:1px dotted rgba(34,211,238,.3)}

/* NOTE */
.note{margin:8px 0;display:flex;gap:8px;align-items:flex-start}
.note .note-meta{color:var(--dim);font-size:.7rem;min-width:64px;padding-top:8px}
.note textarea{flex:1;min-height:48px;font-size:.85rem}

/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{background:var(--glass);border:1px solid var(--border);color:var(--muted);
  border-radius:10px;padding:7px 14px;cursor:pointer;font-size:.8rem;font-weight:600;
  transition:all .2s}
.tabs button:hover{color:var(--text)}
.tabs button.active{color:var(--cyan);border-color:rgba(34,211,238,.3);background:rgba(34,211,238,.06)}

/* CCE GRID */
.ccb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}

/* ROWS / UTILS */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.empty{color:var(--dim);font-style:italic;padding:24px;text-align:center}
.due-today{color:var(--amber);font-weight:600}
.due-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);gap:10px;flex-wrap:wrap}

/* BAR */
.bar{height:6px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));border-radius:99px;transition:width .5s}

/* PRE */
pre.sched{white-space:pre-wrap;font-size:.82rem;line-height:1.6;background:rgba(255,255,255,.02);
  padding:14px;border-radius:10px;border:1px solid var(--border)}
.subtle{color:var(--dim);font-size:.8rem}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.glass,details.unit,.stat,.meta-chip{animation:fadeIn .3s ease both}

/* RESPONSIVE */
@media(max-width:700px){
  header{padding:10px 14px}
  header h1{font-size:1rem}
  main{padding:16px 12px 60px}
  .grid.c2,.grid.c3{grid-template-columns:1fr}
  .ccb-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div><h1>🩺 RACGP Fellowship Study System</h1><div class="sub">Dr Kangxian Lim · AGPT · AKT+KFP 2027.1 (Jan 15/16) · CCE 2027.1 (June)</div></div>
</header>
<main id="app"><div class="empty" style="margin-top:40px">Loading…</div></main>
<script>
const S = { tab:'today' };
const app = document.getElementById('app');
const api = async (p, opts) => (await fetch('/api'+p, opts)).json();
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pj = s => { try { return typeof s==='string'? JSON.parse(s): s; } catch { return s; } };

const NAV = [
  ['today','📅 Today'],['dashboard','📊 Dashboard'],['curriculum','📚 Curriculum'],['questions','❓ Questions'],
  ['cce','🗣️ CCE'],['guidelines','📋 Guidelines'],['resources','🔗 Resources'],
  ['rapid','⚡ Rapid Revision'],['schedule','🗓️ Schedule'],['mistakes','🧠 Mistakes'],['meta','🏫 Exam Map']
];
function nav() {
  const n = document.createElement('nav');
  NAV.forEach(([id,label]) => {
    const b = document.createElement('button');
    b.textContent = label; b.className = S.tab===id?'active':'';
    b.onclick = () => { S.tab = id; render(); };
    n.appendChild(b);
  });
  return n;
}
document.querySelector('header').appendChild(nav());

async function render() {
  app.innerHTML = '<div class="empty" style="margin-top:40px">Loading…</div>';
  try {
    if (S.tab==='today') await vToday();
    else if (S.tab==='dashboard') await vDashboard();
    else if (S.tab==='curriculum') await vCurriculum();
    else if (S.tab==='questions') await vQuestions();
    else if (S.tab==='cce') await vCCE();
    else if (S.tab==='guidelines') await vGuidelines();
    else if (S.tab==='resources') await vResources();
    else if (S.tab==='rapid') await vRapid();
    else if (S.tab==='schedule') await vSchedule();
    else if (S.tab==='mistakes') await vMistakes();
    else if (S.tab==='meta') await vMeta();
  } catch (e) {
    app.innerHTML = `<div class="glass" style="border-color:var(--red);margin:40px 0">⚠️ Error: ${esc(e.message)}</div>`;
  }
}

// ========== TODAY ==========
async function vToday() {
  const t = await api('/today');
  const resLinks = rs => (pj(rs)||[]).map(r=>`<a href="${esc(r.url)}" target="_blank" class="gl-link">${esc(r.label||r.title)} ↗</a>`).join(' · ') || '<span class="subtle">—</span>';
  const focusCards = (t.focus||[]).map(u=>`
    <div class="glass" style="margin-bottom:12px">
      <div class="flex-between">
        <h3 style="margin:0;font-size:1rem">${esc(u.name)}</h3>
        <span class="pill ${u.type==='core'?'tier1':'tier2'}">${u.question_count} questions</span>
      </div>
      ${t.week?`<div class="subtle" style="margin-top:2px">Week ${t.week} focus</div>`:''}
      ${(u.topics||[]).length?`<div style="margin-top:8px">${u.topics.map(tp=>`
        <div class="due-row"><span><span class="pill ${tp.priority}">${tp.priority==='VH'?'🔴':tp.priority==='H'?'🟠':tp.priority==='M'?'🟡':'🟢'}</span> <b>${esc(tp.name)}</b> <span class="subtle" style="margin-left:4px">${esc(tp.status)}</span></span>
        <span class="subtle" style="max-width:60%">${esc((tp.must_know||'').slice(0,80))}${(tp.must_know||'').length>80?'…':''}</span></div>`).join('')}</div>`:'<div class="empty">No topics mapped to this unit</div>'}
      <div style="margin-top:10px"><span class="sec-h">Resources</span><br>${resLinks(u.guidelines)}<br>${resLinks(u.materials)}</div>
      ${(u.wisdom||[]).length?`<details style="margin-top:8px"><summary>💡 ${u.wisdom.length} GP tips</summary><div style="margin:6px 0">${u.wisdom.map(w=>`<div class="li">💡 ${esc(w)}</div>`).join('')}</div></details>`:''}
    </div>`).join('');

  app.innerHTML = `
  <h2>Today · ${new Date().toLocaleDateString('en-AU',{weekday:'long', day:'numeric', month:'long'})}</h2>
  <p class="lead">${t.week?`Week ${t.week} of 18`:''} · ${t.daysToExam} days to AKT/KFP (15 Jan 2027)</p>

  ${t.week? `<div class="glass" style="border-color:var(--cyan)">
    <div class="flex-between"><h3 style="margin:0;font-size:1rem">🎯 This week's focus</h3><span class="subtle">from the 18-week plan</span></div>
    <p class="subtle" style="margin:6px 0 2px;font-size:.85rem">Weekday rhythm: 20 min topic review + 20 min questions + 10 min mistakes. Weekend: one 2-4 h deep block.</p>
  </div>`:''}

  ${(t.focus||[]).length? focusCards : `<div class="glass" style="margin-top:12px"><div class="empty">No units scheduled this week — exam prep phase. Hit the Rapid Revision tab, or work your weakest topics below.</div></div>`}

  <div class="glass" style="margin-top:12px">
    <div class="flex-between"><h3 style="margin:0;font-size:1rem">🔁 Reviews due</h3><span class="subtle">${(t.due_reviews||[]).length} topic(s)</span></div>
    ${(t.due_reviews||[]).length? `<div style="margin-top:6px">${t.due_reviews.slice(0,12).map(tp=>`
      <div class="due-row"><span>${esc(tp)}</span>
        <span class="row" style="gap:6px">
          <button class="btn subtle tiny" onclick="revQ('${esc(tp)}','again')">Again</button>
          <button class="btn tiny" onclick="revQ('${esc(tp)}','good')">Good</button>
          <button class="btn green tiny" onclick="revQ('${esc(tp)}','easy')">Easy</button>
        </span></div>`).join('')}</div>` : '<div class="empty">Nothing due — answer questions to drive the scheduler</div>'}
  </div>

  ${(t.weakest||[]).length?`<div class="glass" style="margin-top:12px">
    <h3 style="margin:0 0 6px;font-size:1rem">📉 Weakest topics (≥2 attempts)</h3>
    ${t.weakest.map(w=>`<div class="due-row"><span>${esc(w.topic)}</span><span class="subtle">${w.pct}% · ${w.n} attempts</span></div>`).join('')}
  </div>`:''}`;
}

// ========== DASHBOARD ==========
async function vDashboard() {
  const d = await api('/dashboard');
  const acc = d.accuracy==null?'—':d.accuracy+'%';
  const akt = (d.by_type||[]).find(x=>x.type==='AKT');
  const kfp = (d.by_type||[]).find(x=>x.type==='KFP');
  const pct = (a,b) => b? Math.round(100*a/b) : 0;
  const days = s => { const n = countdown(s); return n>0? `${n} days`: 'passed'; };
  const goals = JSON.parse(localStorage.getItem('weeklyGoals')||'{}');
  const goalList = [
    'Work through 1 curriculum unit end-to-end',
    'Complete 15+ AKT questions and log every miss',
    'Do 2 KFP cases aloud, mark against model answers',
    'Read 1 Tier-1 guideline section',
    'Practise 1 CCE case aloud, timed 15 min'
  ];
  const topicsTotal = d.topics_total||0;
  const topicsDone = d.topics_touched||0;
  const pctDone = topicsTotal? Math.round(100*topicsDone/topicsTotal): 0;

  app.innerHTML = `
  <h2>Dashboard</h2>
  <p class="lead">Phase 1 Foundation · ${topicsDone}/${topicsTotal} topics touched · ${d.questions_attempted} questions attempted</p>

  <div class="glass" style="border-color:var(--amber);background:rgba(251,191,36,.04)">
    <b style="color:var(--amber)">⚠️ Enrolment: AKT/KFP 2027.1 closes 1 Oct 2026</b> —
    <span class="subtle">${days('2026-10-01')} remaining · Opens 3 Sep 2026</span>
  </div>

  <div class="grid c3" style="margin-top:18px">
    <div class="stat">
      <div class="num">${topicsDone}/${topicsTotal}</div>
      <div class="lbl">Topics touched</div>
      <div class="bar"><div style="width:${pctDone}%"></div></div>
    </div>
    <div class="stat">
      <div class="num">${d.questions_attempted}</div>
      <div class="lbl">Questions · ${acc} accuracy</div>
    </div>
    <div class="stat">
      <div class="num">${d.open_mistakes}</div>
      <div class="lbl">Open mistakes</div>
    </div>
  </div>

  <div class="grid c2" style="margin-top:14px">
    <div class="glass">
      <h3 style="margin:0 0 10px;font-size:1rem">📝 By exam component</h3>
      <div class="flex-between" style="margin:8px 0"><span><span class="pill tier1">AKT</span> 15 Jan 2027 (${days('2027-01-15')})</span><span class="subtle">${akt? `${akt.n} done · ${pct(akt.c,akt.n)}%`: 'not started'}</span></div>
      <div class="bar"><div style="width:${akt? pct(akt.c,akt.n):0}%"></div></div>
      <div class="flex-between" style="margin:8px 0"><span><span class="pill tier2">KFP</span> 16 Jan 2027 (${days('2027-01-16')})</span><span class="subtle">${kfp? `${kfp.n} parts · ${pct(kfp.c,kfp.n)}%`: 'not started'}</span></div>
      <div class="bar"><div style="width:${kfp? pct(kfp.c,kfp.n):0}%"></div></div>
      <div class="flex-between" style="margin:8px 0"><span><span class="pill tier3">CCE</span> June 2027</span><span class="subtle">practise via CCE tab</span></div>
    </div>

    <div class="glass">
      <h3 style="margin:0 0 8px;font-size:1rem">🎯 Weakest <span class="subtle">(≥2 attempts)</span></h3>
      ${listOrEmpty(d.weakest,r=>`<div class="flex-between"><span>${esc(r.topic)}</span><span class="subtle">${r.pct}% · ${r.n}</span></div>`)}
      <h3 style="margin:14px 0 8px;font-size:1rem">💪 Strongest</h3>
      ${listOrEmpty(d.strongest,r=>`<div class="flex-between"><span>${esc(r.topic)}</span><span class="subtle">${r.pct}% · ${r.n}</span></div>`)}
    </div>
  </div>

  <div class="glass" style="margin-top:14px">
    <div class="flex-between"><h3 style="margin:0;font-size:1rem">🔁 Reviews due today</h3><span class="subtle">${d.due_reviews.length} topic(s)</span></div>
    ${d.due_reviews.length? `<div style="margin-top:8px">${d.due_reviews.slice(0,12).map(t=>`
      <div class="due-row"><span>${esc(t)}</span>
        <span class="row" style="gap:6px">

async function vQuestions() {
  const qs = await api('/questions');
  window.QBANK = qs;
  const nAkt = qs.filter(q=>q.type==='AKT').length;
  const nKfp = qs.filter(q=>q.type==='KFP').length;
  app.innerHTML = `
  <h2>Question bank</h2>
  <p class="lead">${qs.length} questions · Answer first, then see feedback · Misses log to Mistake Log in one click</p>
  <div class="tabs" id="qtabs">
    <button class="active" onclick="qTab('ALL',this)">All (${qs.length})</button>
    <button onclick="qTab('AKT',this)">AKT (${nAkt})</button>
    <button onclick="qTab('KFP',this)">KFP (${nKfp})</button>
  </div>
  <div id="qarea"></div>`;
  window.QSTATE = { filter:'ALL', idx:0 };
  qRender();
}
window.qTab = (f,btn) => { QSTATE.filter=f; document.querySelectorAll('#qtabs button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); QSTATE.idx=0; qRender(); };
function qRender() {
  const qs = QBANK.filter(q=>QSTATE.filter==='ALL'||q.type===QSTATE.filter);
  const area = document.getElementById('qarea');
  if (!qs.length) { area.innerHTML='<div class="empty">No questions yet.</div>'; return; }
  const q = qs[QSTATE.idx % qs.length];
  const opts = pj(q.options); const answers = pj(q.answers);
  let html = `<div class="glass">
    <div class="flex-between"><span class="pill ${q.type==='AKT'?'tier1':'tier2'}">${q.type}</span><span class="subtle">${esc(q.topic)} · ${esc(q.unit)}</span></div>
    <p style="font-size:.95rem;line-height:1.6;margin:12px 0">${esc(q.stem)}</p>
    <div id="qparts"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn green" onclick="qSubmit()">Submit answer</button>
      <button class="btn subtle" onclick="qNext()">Skip →</button>
      <span class="subtle">${QSTATE.idx+1}/${qs.length}</span>
    </div>
  </div><div id="qfb"></div>`;
  area.innerHTML = html;
  if (q.type === 'AKT') {
    document.getElementById('qparts').innerHTML = `<div class="q-options" id="opts">${opts.options.map((o,i)=>`
      <label id="l${i}"><input type="radio" name="q" value="${i}" onchange="qPick(${i})"> <span>${esc(o)}</span></label>`).join('')}</div>`;
    window.QSTATE.pick = null;
  } else {
    const parts = opts.parts || [];
    document.getElementById('qparts').innerHTML = parts.map((p,pi)=>{
      const need = (p.q.match(/TWO|THREE|FOUR|FIVE|SIX/)?.[0])||null;
      const hint = need? `<span class="pill tier2" style="font-size:.7rem">select ${need.toLowerCase()}</span>` : '';
      return `<div style="margin:10px 0"><b style="font-size:.85rem;color:var(--dim)">Part ${pi+1}:</b> ${esc(p.q)} ${hint}</div>
      <div class="q-options">${p.options.map((o,i)=>`<label id="l${pi}_${i}"><input type="checkbox" value="${i}" data-part="${pi}" onchange="qPickMulti(${pi},${i},this.checked)"> <span>${esc(o)}</span></label>`).join('')}</div>`}).join('');
    window.QSTATE.pickMulti = {};
  }
  window.QCUR = { q, opts, answers };
}
window.qPick = i => { QSTATE.pick = i; };
window.qPickMulti = (pi,i,checked) => { (QSTATE.pickMulti[pi] ??= new Set()); checked? QSTATE.pickMulti[pi].add(i): QSTATE.pickMulti[pi].delete(i); };
window.qSubmit = async () => {
  const { q, opts, answers } = QCUR;
  let correct = false;
  if (q.type === 'AKT') {
    if (QSTATE.pick == null) { const m=document.getElementById('qfb'); if(m) m.innerHTML='<div class="feedback no" style="margin:10px 0">Choose an option first.</div>'; return; }
    correct = QSTATE.pick === answers.answers[0];
    document.getElementById(`l${answers.answers[0]}`).classList.add('correct');
    if (!correct) document.getElementById(`l${QSTATE.pick}`).classList.add('wrong');
  } else {
    const parts = pj(q.options).parts || [];
    const anyPicked = Object.values(QSTATE.pickMulti||{}).some(s=>s && s.size>0);
    if (!anyPicked) { const m=document.getElementById('qfb'); if(m) m.innerHTML='<div class="feedback no" style="margin:10px 0">Select at least one option in each part.</div>'; return; }
    let allOk = true;
    parts.forEach((p,pi) => {
      const want = new Set(p.correct);
      const got = QSTATE.pickMulti[pi] || new Set();
      const okThis = [...want].every(w=>got.has(w)) && [...got].every(g=>want.has(g));
      if (!okThis) allOk = false;
      p.correct.forEach(c=>document.getElementById(`l${pi}_${c}`).classList.add('correct'));
      [...got].filter(g=>!want.has(g)).forEach(g=>document.getElementById(`l${pi}_${g}`).classList.add('wrong'));
    });
    correct = allOk;
  }
  await api('/attempts', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question_id:q.id,user_answer:QSTATE.pick??Object.fromEntries(Object.entries(QSTATE.pickMulti||{}).map(([k,v])=>[k,[...v]])),correct})});
  const partsMeta = q.type==='KFP' ? (pj(q.answers).parts||[]).map((p,i)=>`<div class="subtle"><b>Part ${i+1}:</b> ${esc(p.marks)}</div>`).join('') : '';
  document.getElementById('qfb').innerHTML = `
  <div class="feedback ${correct?'ok':'no'}" style="margin:10px 0">
    <b>${correct?'✅ Correct':'❌ Review needed'}</b>
    ${q.explanation?`<div style="margin:6px 0"><b>Why:</b> ${esc(q.explanation)}</div>`:''}
    ${q.pearl?`<div style="margin:4px 0"><b>💎 Pearl:</b> ${esc(q.pearl)}</div>`:''}
    ${q.trap?`<div style="margin:4px 0"><b>⚠️ Trap:</b> ${esc(q.trap)}</div>`:''}
    ${partsMeta}
    ${correct?"":'<button class="btn subtle" style="margin-top:8px" onclick="logMissed()">➕ Log to Mistake Log</button>'}
    <span id="logmsg" style="margin-left:8px;color:var(--green)"></span>
  </div>`;
};
window.logMissed = async () => {
  const { q } = QCUR;
  await api('/mistakes', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({exam:q.type,topic:q.topic,question_ref:'Q'+q.id,my_error:'see question',correct_principle:(q.explanation||q.pearl||'').slice(0,200),why_missed:'knowledge gap'})});
  const m = document.getElementById('logmsg'); if (m) m.textContent='✓ Logged';
};
window.qNext = () => { QSTATE.idx++; qRender(); };

}

// ========== MISTAKES ==========
async function vMistakes() {
  const ms = await api('/mistakes');
  app.innerHTML = `<h2>Mistake log</h2>
  <p class="lead">${ms.length} entries · Categorized by error type</p>
  ${ms.length? `<div class="glass"><table><tr><th>Date</th><th>Exam</th><th>Topic</th><th>Error</th><th>Correct principle</th><th>Category</th><th>Review</th><th></th></tr>
  ${ms.map(m=>`<tr><td class="subtle">${esc(m.created_at?.slice(0,10))}</td><td><span class="pill tier${m.exam==='AKT'?'1':'2'}">${esc(m.exam)}</span></td><td>${esc(m.topic)}</td><td style="max-width:200px">${esc(m.my_error)}</td><td class="subtle" style="max-width:250px">${esc(m.correct_principle)}</td><td>${esc(m.why_missed)}</td><td>${m.review_date?esc(m.review_date):'<span class="due-today">unset</span>'}</td>
  <td><button class="btn subtle tiny" onclick="delMistake(${m.id})" style="padding:4px 8px">✕</button></td></tr>`).join('')}</table></div>`
  : '<div class="glass" style="margin-top:12px"><div class="empty">No mistakes yet — they appear here when you miss a question</div></div>'}
  <div class="glass" style="margin-top:12px">
    <h3 style="margin:0 0 10px;font-size:.95rem">Manual entry</h3>
    <div class="row"><select id="m_exam"><option>AKT</option><option>KFP</option><option>CCE</option></select>
    <input type="text" id="m_topic" placeholder="Topic" style="flex:1;min-width:150px">
    <select id="m_cat"><option>knowledge gap</option><option>guideline recall</option><option>misread question</option><option>poor prioritisation</option><option>over-investigation</option><option>under-investigation</option><option>missed red flag</option><option>unsafe management</option><option>medication error</option><option>communication</option><option>exam technique</option></select></div>
    <div style="margin-top:8px"><textarea id="m_err" placeholder="What happened"></textarea></div>
    <div style="margin-top:8px"><textarea id="m_fix" placeholder="Correct principle"></textarea></div>
    <div class="row" style="margin-top:8px"><input type="date" id="m_rev"><button class="btn" onclick="addMistake()">Add</button></div>
  </div>`;
}
window.addMistake = async () => {
  await api('/mistakes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({exam:m_exam.value,topic:m_topic.value||'general',my_error:m_err.value,correct_principle:m_fix.value,why_missed:m_cat.value,review_date:m_rev.value||null})});
  render();
};
window.delMistake = async id => { await api('/mistakes/'+id,{method:'DELETE'}); render(); };

// ========== META ==========
async function vMeta() {
  const ms = await api('/meta');
  const checked = ms.find(m=>m.key==='exam_structure_summary')?.checked_date||'';
  app.innerHTML = `<h2>Exam map</h2>
  <p class="lead">Verified from official RACGP sources · Last checked: ${esc(checked)}</p>
  ${ms.map(m=>`<div class="meta-chip"><div class="k">${esc(m.key.replace(/_/g,' '))}</div><div class="v">${esc(m.value)}</div>
  ${m.source_url?`<a href="${esc(m.source_url)}" target="_blank">↗ ${esc(m.source_url)}</a> <span class="subtle">(checked ${esc(m.checked_date)})</span>`:''}</div>`).join('')}`;
}

render();
</script>
</body>
</html>
